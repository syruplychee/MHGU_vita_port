name: Host Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc python3-venv

      - name: Install Python tool dependencies
        run: |
          python3 -m venv build/test-python
          build/test-python/bin/python -m pip install -r tools/requirements.txt

      - name: Configure host tests
        run: cmake -S tests -B build/host-tests -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/build/test-python/bin/python"

      - name: Build host tests
        run: cmake --build build/host-tests -j

      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure

      - name: Check Python syntax
        run: build/test-python/bin/python -m compileall -q tools
