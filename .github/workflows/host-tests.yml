name: Host Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc

      - name: Configure host tests
        run: cmake -S tests -B build/host-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build host tests
        run: cmake --build build/host-tests -j

      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure

      - name: Check Python syntax
        run: python3 -m compileall -q tools
